# KLeanScreen macros: [include kleanscreen.cfg] in printer.cfg, after the INDX files.
#
# Needs: the INDX macro package (TOOL_POSITIONS, CHANGE_TOOL, PARK_TOOL,
# LOAD_FILAMENT and its filament_presets), [save_variables], [respond], and
# [pause_resume]. The tool count comes from TOOL_POSITIONS.tool_count.
#
# LOAD_TOOL, UNLOAD_TOOL and PURGE_TOOL work from Mainsail or Fluidd too: they
# use the action:prompt protocol, which KLeanScreen draws the same way.
#
# Per-tool state lives in save_variables as lists indexed by tool number:
#   tool_materials  written by a load ("PLA") and an unload ("")
#   tool_colours    hex without "#", written by the screen's colour picker
#
# To change the material buttons, edit _LOAD_TOOL_MATERIAL and the bed
# temperatures in _LOAD_TOOL_RUN; materials must exist in LOAD_FILAMENT's
# filament_presets.

# LOAD_TOOL, UNLOAD_TOOL and PURGE_TOOL are prompt-driven front doors for
# Mainsail and the touchscreen. A load ends on the purge prompt, whose Done
# cools and parks the tool. All three ask first when Z isn't homed, because
# the tool change then runs a full G28 that probes the bed centre. While
# paused they offer only the tool on the head, since fetching another would
# move the head mid-print.
[gcode_macro LOAD_TOOL]
description: Pick a tool and a material, then load it
gcode:
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set paused = printer.pause_resume.is_paused %}
    {% if paused and act < 0 %}
        { action_raise_error("LOAD_TOOL: paused with no tool on the head") }
    {% elif 'z' not in printer.toolhead.homed_axes and not params.CLEAR %}
        RESPOND TYPE=command MSG="action:prompt_begin Load Filament"
        RESPOND TYPE=command MSG="action:prompt_text Z isn't homed, so the tool change homes first and probes the bed centre. Is the bed clear?"
        RESPOND TYPE=command MSG="action:prompt_button Bed is clear|LOAD_TOOL CLEAR=1|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Load Filament"
        RESPOND TYPE=command MSG="action:prompt_text Which tool are you loading?"
        {% for t in ([act] if paused else range(n)) %}
            RESPOND TYPE=command MSG="action:prompt_button T{t}|_LOAD_TOOL_MATERIAL TOOL={t}|primary"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _LOAD_TOOL_MATERIAL]
gcode:
    {% set t = params.TOOL|int %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Load T{t}"
    RESPOND TYPE=command MSG="action:prompt_text Pick the filament - this sets the load temperature, the safety model and the bed warmup."
    RESPOND TYPE=command MSG="action:prompt_button TPU  (bed 35C)|_LOAD_TOOL_RUN TOOL={t} TYPE=TPU|primary"
    RESPOND TYPE=command MSG="action:prompt_button PLA  (bed 55C)|_LOAD_TOOL_RUN TOOL={t} TYPE=PLA|primary"
    RESPOND TYPE=command MSG="action:prompt_button PETG  (bed 80C)|_LOAD_TOOL_RUN TOOL={t} TYPE=PETG|primary"
    RESPOND TYPE=command MSG="action:prompt_button ASA  (bed 100C)|_LOAD_TOOL_RUN TOOL={t} TYPE=ASA|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_TOOL_RUN]
variable_bed_temps: {'TPU': 35, 'PLA': 55, 'PETG': 80, 'ASA': 100}   # started, not waited on
gcode:
    {% set t = params.TOOL|int %}
    {% set type = params.TYPE|string|upper %}
    {% set bed_temp = bed_temps[type]|default(50) %}
    {% set printing = printer.print_stats.state in ['printing', 'paused'] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if printer.heater_bed.target < bed_temp and not printing %}
        M140 S{bed_temp}                 # never cool an already-hotter bed
    {% endif %}
    LOAD_FILAMENT TOOL={t} TYPE={type}
    _SET_TOOL_VAR VAR=tool_materials TOOL={t} VALUE={type}
    _PURGE_PROMPT TOOL={t} TYPE={type} LOADED=1   # its Done cools and parks

# Per-tool state for screens: save_variables lists indexed by tool number.
# tool_materials is written by LOAD_TOOL and UNLOAD_FILAMENT ("" = empty);
# tool_colours is written by the touchscreen, as hex without the "#" (Klipper
# cuts a G-code line at "#"). A LOAD_FILAMENT run by hand isn't recorded.
[gcode_macro _SET_TOOL_VAR]
description: Inner - set one tool's entry in a per-tool list variable
gcode:
    {% set var = params.VAR|string|lower %}
    {% set t = params.TOOL|int %}
    {% set val = params.VALUE|default('')|string %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% set old = printer.save_variables.variables[var]|default([]) %}
    {% set ns = namespace(out=[]) %}
    {% for k in range(n) %}
        {% set ns.out = ns.out + [val if k == t else (old[k] if k < old|length else '')] %}
    {% endfor %}
    SAVE_VARIABLE VARIABLE={var} VALUE="{ns.out}"

# The purge prompt: "Purge" buttons for 10 / 25 / 50 mm in a button group,
# then Done. Done cools and parks unless a print is running or paused.
# Purging extrudes wherever the head is, as UNLOAD_FILAMENT's ram does.
[gcode_macro _PURGE_PROMPT]
gcode:
    {% set t = params.TOOL|int %}
    {% set type = params.TYPE|string|upper %}
    {% set printing = printer.print_stats.state in ['printing', 'paused'] %}
    {% set temp = printer.extruder.target|int %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if params.LOADED|default(0)|int %}
        RESPOND TYPE=command MSG="action:prompt_begin T{t} loaded - {type}"
        RESPOND TYPE=command MSG="action:prompt_text T{t} is still hot at {temp}C. Purge some more if it isn't running clean yet."
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Purge T{t} - {type}"
        RESPOND TYPE=command MSG="action:prompt_text T{t} is at {temp}C. Purge until it runs clean."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text Purge"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for mm in [10, 25, 50] %}
        RESPOND TYPE=command MSG="action:prompt_button {mm} mm|_PURGE_RUN TOOL={t} TYPE={type} MM={mm}|secondary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% if printing %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Done|_PURGE_DONE TOOL={t}|primary"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Done - cool and park|_PURGE_DONE TOOL={t}|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"

# Reheats first, in case the prompt sat until the idle timeout. While paused
# it keeps the print's temperature rather than the material preset.
[gcode_macro _PURGE_RUN]
gcode:
    {% set t = params.TOOL|int %}
    {% set type = params.TYPE|string|upper %}
    {% set mm = params.MM|default(10)|float %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set preset = printer["gcode_macro LOAD_FILAMENT"].filament_presets[type]|default({}) %}
    {% set printing = printer.print_stats.state in ['printing', 'paused'] %}
    {% set min_t = printer.configfile.settings.extruder.min_extrude_temp %}
    {% set temp = printer.extruder.target if printing and printer.extruder.target >= min_t else preset.temp|default(250) %}
    {% set speed = preset.speed|default(3.0)|float %}   # mm/s; TPU's preset is 2
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if act != t %}
        { action_raise_error("_PURGE_RUN: T%d is not on the head" % t) }
    {% endif %}
    M117 Purging T{t} {mm|int} mm...
    M109 S{temp}
    SAVE_GCODE_STATE NAME=purge_state
    M83
    G1 E{mm} F{speed * 60}
    M400
    RESTORE_GCODE_STATE NAME=purge_state
    M117 Purged T{t}
    _PURGE_PROMPT TOOL={t} TYPE={type}

[gcode_macro _PURGE_DONE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if printer.print_stats.state not in ['printing', 'paused'] %}
        M104 S0
        PARK_TOOL
        M117 T{params.TOOL|int} parked
    {% endif %}

# PURGE_TOOL TOOL=n picks up a loaded tool, heats it to its material's
# preset and shows the purge prompt. TYPE= overrides the recorded material.
# Same "Is the bed clear?" and paused-means-the-tool-on-the-head rules as
# LOAD_TOOL; refused mid-print.
[gcode_macro PURGE_TOOL]
description: Heat a tool and purge until it runs clean
gcode:
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set paused = printer.pause_resume.is_paused %}
    {% set t = params.TOOL|default(act)|int %}
    {% set mats = printer.save_variables.variables.tool_materials|default([]) %}
    {% set type = params.TYPE|default(mats[t] if 0 <= t < mats|length else '')|string|upper %}
    {% set preset = printer["gcode_macro LOAD_FILAMENT"].filament_presets[type]|default({}) %}
    {% set min_t = printer.configfile.settings.extruder.min_extrude_temp %}
    {% set temp = printer.extruder.target if paused and printer.extruder.target >= min_t else preset.temp|default(250) %}
    {% if printer.print_stats.state == 'printing' %}
        { action_raise_error("PURGE_TOOL: a print is running. Pause it first.") }
    {% elif t < 0 or t >= n %}
        { action_raise_error("PURGE_TOOL: no tool given and none on the head. Use PURGE_TOOL TOOL=<n>.") }
    {% elif type == '' %}
        { action_raise_error("PURGE_TOOL: T%d has no recorded material. Use PURGE_TOOL TOOL=%d TYPE=<material>." % (t, t)) }
    {% elif paused and t != act %}
        { action_raise_error("PURGE_TOOL: paused, so only the tool on the head (T%d) can purge" % act) }
    {% elif 'z' not in printer.toolhead.homed_axes and not params.CLEAR %}
        RESPOND TYPE=command MSG="action:prompt_begin Purge"
        RESPOND TYPE=command MSG="action:prompt_text Z isn't homed, so the tool change homes first and probes the bed centre. Is the bed clear?"
        RESPOND TYPE=command MSG="action:prompt_button Bed is clear|PURGE_TOOL TOOL={t} TYPE={type} CLEAR=1|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        {% if t != act %}
            CHANGE_TOOL TOOL={t}
        {% endif %}
        M117 Heating T{t} to {temp}C...
        M109 S{temp}
        _PURGE_PROMPT TOOL={t} TYPE={type}
    {% endif %}

# While paused, the unload keeps the heater on and the tool on the head, as M600 does.
[gcode_macro UNLOAD_TOOL]
description: Pick a tool, then unload it
gcode:
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set paused = printer.pause_resume.is_paused %}
    {% if paused and act < 0 %}
        { action_raise_error("UNLOAD_TOOL: paused with no tool on the head") }
    {% elif 'z' not in printer.toolhead.homed_axes and not params.CLEAR %}
        RESPOND TYPE=command MSG="action:prompt_begin Unload Filament"
        RESPOND TYPE=command MSG="action:prompt_text Z isn't homed, so the tool change homes first and probes the bed centre. Is the bed clear?"
        RESPOND TYPE=command MSG="action:prompt_button Bed is clear|UNLOAD_TOOL CLEAR=1|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Unload Filament"
        RESPOND TYPE=command MSG="action:prompt_text Which tool are you unloading?"
        {% for t in ([act] if paused else range(n)) %}
            RESPOND TYPE=command MSG="action:prompt_button T{t}|_UNLOAD_TOOL_RUN TOOL={t}|primary"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _UNLOAD_TOOL_RUN]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    UNLOAD_FILAMENT TOOL={params.TOOL|int} COOLDOWN={0 if printer.pause_resume.is_paused else 1}

# Prusa MK3 style unload: ram, break free, cooling moves, then the long pull.
# TOOL= defaults to the tool on the head. COOLDOWN=0 leaves the heaters on and
# the tool on the head (used by M600). 250C suits every material loaded here.
[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 100           # final pull; not measured against the INDX filament path
variable_unload_temp:     250
variable_unload_speed:    2000          # mm/min for the final pull
gcode:
    {% set cooldown = params.COOLDOWN|default(1)|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set t = params.TOOL|default(act)|int %}
    {% if t < 0 %}
        { action_raise_error("UNLOAD_FILAMENT: no tool on the head. Use UNLOAD_FILAMENT TOOL=<n>.") }
    {% endif %}
    {% if t != act %}
        CHANGE_TOOL TOOL={t}
    {% endif %}
    {% if t != act or printer.extruder.temperature < unload_temp %}
        M117 Heating T{t} to unload {unload_temp}C...
        M109 S{unload_temp}
    {% endif %}
    M117 Unloading T{t}...
    SAVE_GCODE_STATE NAME=unload_state
    M83                              # relative extrusion
    G92 E0
    # ram: pack the melt zone at rising speed to shape the tip
    G1 E1.0 F1000
    G1 E1.0 F1500
    G1 E2.0 F2000
    G1 E1.5 F3000
    G1 E2.5 F4000
    # break free and lift the tip clear of the melt zone
    G1 E-15 F5000
    G1 E-14 F1200
    G1 E-6 F600
    # cooling moves: set the tip thin in the cool zone instead of mushrooming
    G1 E10 F700
    G1 E-10 F400
    G1 E10 F700
    G1 E-10 F400
    G1 E-{unload_distance} F{unload_speed}
    M400
    RESTORE_GCODE_STATE NAME=unload_state
    _SET_TOOL_VAR VAR=tool_materials TOOL={t} VALUE=
    {% if cooldown %}
        TURN_OFF_HEATERS             # unload is usually post-print
        PARK_TOOL
        M117 Unloaded T{t} - heaters off
    {% else %}
        M117 Unloaded T{t}
    {% endif %}


# Screen sleep and wake from G-code (for example SCREEN_SLEEP in PRINT_END).
# KLeanScreen draws black itself and leaves the HDMI output and touch on.
[gcode_macro SCREEN_SLEEP]
description: Blank the touchscreen (a tap or SCREEN_WAKE wakes it)
gcode:
    RESPOND TYPE=command MSG="kleanscreen:sleep"

[gcode_macro SCREEN_WAKE]
description: Wake the touchscreen
gcode:
    RESPOND TYPE=command MSG="kleanscreen:wake"
