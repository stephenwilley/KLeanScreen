# Only for a BTT HDMI5 on an RK3566 board (Orange Pi CM4 and similar): the panel
# needs the HDMI clock fix and the EDID override before cage starts. Install as
# /etc/systemd/system/KLeanScreen.service.d/10-btt-hdmi5-rk3566.conf
# hdmi-clock-fix.service is the out-of-tree module that restores the 37.125 MHz
# reference clock; see the README.
[Unit]
Requires=hdmi-clock-fix.service kleanscreen-edid.service
After=hdmi-clock-fix.service kleanscreen-edid.service
